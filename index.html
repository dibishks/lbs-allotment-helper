<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LBS Allotment Predictor — Kerala 2025</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="data.js"></script>
<style>
  :root { --govt:#0b6b3a; --self:#1d4e89; --bg:#f4f6f8; --ink:#1a2330; --line:#dde3ea; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 60px; }
  header.top { background:#16243a; color:#fff; padding:18px 0; }
  header.top .wrap { padding-top:0; padding-bottom:0; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header.top h1 { font-size:20px; margin:0; }
  header.top .sub { color:#9fb3cc; font-size:13px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; margin-top:18px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  label.fld { font-weight:600; font-size:14px; display:block; margin-bottom:6px; }
  .courserow { margin-bottom:14px; }
  .courserow select { font-size:16px; padding:9px 12px; width:100%; max-width:520px; border:2px solid #c7d0db; border-radius:8px; }
  .markrow { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
  input[type=number] { font-size:24px; padding:10px 14px; width:170px; border:2px solid #c7d0db; border-radius:8px; }
  input[type=number]:focus, select:focus { outline:none; border-color:var(--self); }
  .hint { color:#5c6b7d; font-size:13px; }
  .toggle { font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer; }
  .summary { display:flex; gap:18px; flex-wrap:wrap; margin-top:10px; font-size:14px; }
  .summary b { font-size:18px; }
  h2.cat { font-size:17px; margin:26px 0 8px; padding-left:10px; border-left:5px solid; }
  h2.govt { border-color:var(--govt); color:var(--govt); }
  h2.self { border-color:var(--self); color:var(--self); }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:14px; }
  th, td { padding:9px 10px; text-align:left; border-bottom:1px solid var(--line); }
  th { background:#eef2f6; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:#46586d; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#f0f6ff; }
  td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; }
  .code { font-weight:700; color:var(--self); }
  .pill { display:inline-block; padding:1px 8px; border-radius:20px; font-size:12px; font-weight:600; }
  .pill.ok { background:#e3f5ea; color:var(--govt); }
  .empty { color:#7a8aa0; padding:14px; font-style:italic; }
  .backlink { display:inline-block; margin-bottom:12px; font-size:14px; color:var(--self); cursor:pointer; font-weight:600; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 14px; min-width:120px; }
  .stat .k { font-size:12px; color:#5c6b7d; } .stat .v { font-size:20px; font-weight:700; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin:12px 0; }
  select { padding:6px 8px; border:1px solid #c7d0db; border-radius:6px; font-size:14px; }
  .muted { color:#7a8aa0; }
  .note { position:relative; background:#fff8e6; border:1px solid #f0d98a; border-left:5px solid #e0a800; border-radius:8px; padding:12px 38px 12px 14px; margin-top:18px; font-size:13.5px; line-height:1.5; color:#5b4a12; }
  .note b { color:#7a5e00; }
  .note .x { position:absolute; top:6px; right:8px; border:none; background:transparent; font-size:20px; line-height:1; color:#9a7b1a; cursor:pointer; padding:2px 6px; border-radius:6px; }
  .note .x:hover { background:#f0d98a; color:#5b4a12; }
  .notemini { display:inline-flex; align-items:center; gap:6px; margin-top:14px; font-size:12.5px; color:#9a7b1a; background:#fff8e6; border:1px solid #f0d98a; border-radius:20px; padding:4px 12px; cursor:pointer; }
  .notemini:hover { background:#fdf0c8; }
  footer { margin-top:30px; font-size:12px; color:#8a98aa; text-align:center; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>LBS Allotment Predictor</h1>
  <span class="sub">Kerala Nursing &amp; Paramedical 2025 — based on last year's allotment cutoffs</span>
</div></header>
<div id="root" class="wrap"></div>
<footer class="wrap">Data: lbscentre.in 2025 allotment · Predictions are indicative only, based on last year's last-allotted index marks.</footer>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const DATA = window.LBS_DATA;
const COURSES = DATA.courses;
const COURSE_BY_VAL = Object.fromEntries(COURSES.map(c => [c.value, c]));
const cleanName = n => n.replace(/^[A-Z]+\s*-\s*/, '');
const courseLabel = n => n.replace(/\s*\(.*?\)\s*$/, '').trim() || n; // drop trailing "(...)"

const QUOTA_LABEL = {
  SM:'State Merit (General)', SC:'Scheduled Caste', ST:'Scheduled Tribe',
  EZ:'Ezhava (EZ)', MU:'Muslim (MU)', LC:'Latin Catholic / SIUC (LC)',
  DV:'Dheevara (DV)', VK:'Viswakarma (VK)', KU:'Kudumbi (KU)',
  EW:'Forward EWS (EW)', NR:'NRI', MQ:'Management (MQ)',
};
const quotaText = q => QUOTA_LABEL[q] ? `${q} — ${QUOTA_LABEL[q]}` : q;

function useHashRoute() {
  const [hash, setHash] = useState(window.location.hash);
  useEffect(() => {
    const fn = () => setHash(window.location.hash);
    window.addEventListener('hashchange', fn);
    return () => window.removeEventListener('hashchange', fn);
  }, []);
  return hash;
}
const go = (h) => { window.location.hash = h; window.scrollTo(0, 0); };

// ---------------- Home / search ----------------
function Home() {
  const [courseVal, setCourseVal] = useState(() => {
    const saved = localStorage.getItem('lbsCourse');
    return COURSE_BY_VAL[saved] ? saved : COURSES[0].value;
  });
  const [markStr, setMarkStr] = useState(localStorage.getItem('lbsMark') || '');
  const [quota, setQuota] = useState('ALL');
  const [showAll, setShowAll] = useState(false);
  const [noteOpen, setNoteOpen] = useState(localStorage.getItem('lbsNoteHidden') !== '1');

  const course = COURSE_BY_VAL[courseVal];
  const mark = parseFloat(markStr);
  const hasMark = !isNaN(mark);

  useEffect(() => { localStorage.setItem('lbsCourse', courseVal); }, [courseVal]);
  useEffect(() => { if (markStr) localStorage.setItem('lbsMark', markStr); }, [markStr]);
  const hideNote = () => { setNoteOpen(false); localStorage.setItem('lbsNoteHidden', '1'); };
  const showNote = () => { setNoteOpen(true); localStorage.setItem('lbsNoteHidden', '0'); };
  const onCourse = (v) => { setCourseVal(v); setQuota('ALL'); }; // quota sets differ per course

  const cutoffOf = (c) => quota === 'ALL' ? c.cutoff : (c.cutoffs[quota] ?? null);

  const lists = useMemo(() => {
    const eligible = (c) => { const cut = cutoffOf(c); return cut != null && (showAll || (hasMark && mark >= cut)); };
    const sort = arr => arr.slice().sort((a, b) => (cutoffOf(b) ?? -1) - (cutoffOf(a) ?? -1));
    const pick = cat => sort(course.colleges.filter(c => c.category === cat && eligible(c)));
    return { govt: pick('Government'), self: pick('Self-financing') };
  }, [courseVal, mark, hasMark, showAll, quota]);

  const total = lists.govt.length + lists.self.length;

  return (
    <div>
      {noteOpen
        ? <div className="note">
            <button className="x" onClick={hideNote} title="Dismiss" aria-label="Dismiss note">×</button>
            <b>⚠ Please note:</b> This tool shows information based purely on the <b>2025 LBS allotment list</b> marks.
            The predictions are based only on last year's data and are <b>indicative only</b> —
            they are <b>not a guarantee</b> of allotment. Actual cutoffs depend on that year's applicants,
            seat matrix and ranks, and may differ. Always rely on the official LBS Centre allotment for final decisions.
          </div>
        : <div className="notemini" onClick={showNote}>⚠ Indicative only — based on 2025 data, not a guarantee. <u>Read more</u></div>}

      <div className="panel">
        <div className="courserow">
          <label className="fld" htmlFor="cs">Course</label>
          <select id="cs" value={courseVal} onChange={e => onCourse(e.target.value)}>
            {COURSES.map(c => <option key={c.value} value={c.value}>{c.name} · {c.colleges.length} colleges</option>)}
          </select>
        </div>

        <div className="markrow">
          <div>
            <label className="fld" htmlFor="mk">Your Index Mark</label>
            <input id="mk" type="number" min="0" max={course.maxIndex} step="0.01"
                   placeholder="e.g. 283" value={markStr}
                   onChange={e => setMarkStr(e.target.value)} />
          </div>
          <div>
            <label className="fld" htmlFor="qt">Filter by Quota</label>
            <select id="qt" value={quota} onChange={e => setQuota(e.target.value)}>
              <option value="ALL">All quotas</option>
              {course.quotas.map(q => <option key={q} value={q}>{quotaText(q)}</option>)}
            </select>
          </div>
          <label className="toggle">
            <input type="checkbox" checked={showAll} onChange={e => setShowAll(e.target.checked)} />
            Show all colleges (ignore my mark)
          </label>
        </div>

        <p className="hint">Last year's highest index in this course: <b>{course.maxIndex}</b>. {course.colleges.length} colleges offered it.</p>
        {hasMark && !showAll &&
          <div className="summary">
            <span>Colleges you could be allotted: <b>{total}</b></span>
            <span className="muted">({lists.govt.length} Government · {lists.self.length} Self-financing)
              {quota !== 'ALL' && <> · quota <b>{quota}</b></>}</span>
          </div>}
        {!hasMark && !showAll && <p className="hint">Enter your mark to see colleges where last year's last-allotted candidate scored at or below yours. Pick a quota for a cutoff specific to your category.</p>}
        {quota !== 'ALL' && <p className="hint">Showing only colleges that allotted seats under <b>{quotaText(quota)}</b> last year. Cutoff column = lowest index allotted in that quota.</p>}
      </div>

      <CategoryTable title="Government Colleges" cls="govt" rows={lists.govt} mark={mark} hasMark={hasMark} quota={quota} cutoffOf={cutoffOf} courseVal={courseVal} />
      <CategoryTable title="Self-financing Colleges" cls="self" rows={lists.self} mark={mark} hasMark={hasMark} quota={quota} cutoffOf={cutoffOf} courseVal={courseVal} />
    </div>
  );
}

function CategoryTable({ title, cls, rows, mark, hasMark, quota, cutoffOf, courseVal }) {
  const allQuotas = quota === 'ALL';
  const cutHead = allQuotas ? 'Last Allotted' : `Last Allotted (${quota})`;
  return (
    <div>
      <h2 className={"cat " + cls}>{title} <span className="muted" style={{fontWeight:400,fontSize:14}}>({rows.length})</span></h2>
      {rows.length === 0
        ? <div className="panel empty">No matching colleges.</div>
        : <table>
            <thead><tr>
              <th>Code</th><th>College</th>
              <th className="num">{cutHead}</th>
              {allQuotas && <th className="num">Merit (SM)</th>}
              <th className="num">Seats</th>
              {hasMark && <th className="num">Your Margin</th>}
            </tr></thead>
            <tbody>
              {rows.map(c => {
                const cut = cutoffOf(c);
                const margin = hasMark && cut != null ? (mark - cut) : null;
                return (
                  <tr key={c.value} onClick={() => go('#/c/' + courseVal + '/' + c.value)}>
                    <td><span className="code">{c.code}</span></td>
                    <td>{cleanName(c.name)}</td>
                    <td className="num">{cut != null ? cut.toFixed(2) : '—'}</td>
                    {allQuotas && <td className="num muted">{c.cutoffMerit != null ? c.cutoffMerit.toFixed(2) : '—'}</td>}
                    <td className="num">{c.allotted}</td>
                    {hasMark && <td className="num">{margin != null ? <span className="pill ok">+{margin.toFixed(2)}</span> : '—'}</td>}
                  </tr>
                );
              })}
            </tbody>
          </table>}
    </div>
  );
}

// ---------------- College detail ----------------
const COLS = [
  ['sl','Sl'], ['rl','Ranklist'], ['app','Appln No.'], ['name','Name'], ['q','Quota'],
  ['al','Allotment'], ['idx','Index Mark'], ['rsm','Rank (State Merit)'], ['rc','Rank (Community)'],
  ['fee','Fee Paid'], ['adm','Admitted'], ['rem','Remarks'],
];
const NUMCOLS = new Set(['sl','idx']);

function College({ courseVal, value }) {
  const course = COURSE_BY_VAL[courseVal];
  const c = course && course.colleges.find(x => x.value === value);
  const rows = DATA.allotments[courseVal + '__' + value] || [];
  const [quota, setQuota] = useState('ALL');
  const quotas = useMemo(() => ['ALL', ...Array.from(new Set(rows.map(r => r.q).filter(Boolean))).sort()], [courseVal, value]);
  const shown = quota === 'ALL' ? rows : rows.filter(r => r.q === quota);

  if (!c) return <div className="panel">Unknown college. <span className="backlink" onClick={() => go('#/')}>← Back</span></div>;
  return (
    <div>
      <span className="backlink" onClick={() => go('#/')}>← Back to predictor</span>
      <div className="panel">
        <h2 style={{margin:'0 0 4px'}}>{cleanName(c.name)}</h2>
        <div className="muted">{c.code} · <span className={"pill " + (c.category==='Government'?'ok':'')}>{c.category}</span> · {course.name}</div>
        <div className="stats">
          <div className="stat"><div className="k">Seats allotted</div><div className="v">{c.allotted}</div></div>
          <div className="stat"><div className="k">Top index</div><div className="v">{c.top != null ? c.top.toFixed(2) : '—'}</div></div>
          <div className="stat"><div className="k">Last allotted</div><div className="v">{c.cutoff != null ? c.cutoff.toFixed(2) : '—'}</div></div>
          <div className="stat"><div className="k">Merit (SM) cutoff</div><div className="v">{c.cutoffMerit != null ? c.cutoffMerit.toFixed(2) : '—'}</div></div>
        </div>
        <div style={{margin:'6px 0 14px'}}>
          <label className="fld" style={{display:'inline'}}>Filter quota: </label>
          <select value={quota} onChange={e => setQuota(e.target.value)}>
            {quotas.map(q => <option key={q} value={q}>{q}</option>)}
          </select>
          <span className="muted" style={{marginLeft:10}}>{shown.length} rows</span>
        </div>
        {rows.length === 0
          ? <div className="empty">No allotment data for this college (e.g. NRI-quota seat with no allotment).</div>
          : <div style={{overflowX:'auto'}}>
              <table>
                <thead><tr>{COLS.map(([k,l]) => <th key={k} className={NUMCOLS.has(k)?'num':''}>{l}</th>)}</tr></thead>
                <tbody>
                  {shown.map((r,i) => <tr key={i} style={{cursor:'default'}}>
                    {COLS.map(([k]) => <td key={k} className={NUMCOLS.has(k)?'num':''}>
                      {k==='idx' && r[k]!=null ? r[k].toFixed(2) : (r[k] === '' || r[k]==null ? '—' : r[k])}
                    </td>)}
                  </tr>)}
                </tbody>
              </table>
            </div>}
      </div>
    </div>
  );
}

function App() {
  const hash = useHashRoute();
  const m = hash.match(/^#\/c\/([^/]+)\/(.+)$/);
  return m ? <College courseVal={decodeURIComponent(m[1])} value={decodeURIComponent(m[2])} /> : <Home />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
